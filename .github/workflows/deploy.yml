name: 部署到阿里云 (SSH)

# 推送到 main 后自动构建并上传到服务器
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站
        run: npm run build

      - name: 通过 SSH 上传 dist 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".vitepress/dist/*"
          target: ${{ secrets.SSH_DEPLOY_PATH }}
          strip_components: 2            # 去掉 .vitepress/dist 前缀，直接放目标目录
          rm: true                        # 先清空目标目录再上传，避免旧文件残留
